<app-navbar></app-navbar>

<main class="proximamente-page">

  <section class="proximamente">

    <header class="proximamente-header">

      <h1>
        Próximamente
      </h1>

      <p>
        Próximos estrenos en CineBera.
      </p>

    </header>


    @if (peliculas.length > 0) {

      <div class="proximamente-listado">

        @for (
          pelicula of peliculas;
          track pelicula.id
        ) {

          <app-pelicula-card
            [pelicula]="pelicula"

            [mostrarBotonFunciones]="
              estaEnPreventa(pelicula)
            "

            (peliculaSeleccionada)="
              seleccionarPelicula($event)
            ">
          </app-pelicula-card>

          <!--
            Esta sección solamente existe en el DOM
            cuando faltan entre 1 y 7 días para
            el estreno de la película.
          -->
          <div
            *appEnPreventa="pelicula"
            class="preventa-info"
          >

            <strong>
              Preventa disponible
            </strong>


</div>

        }

      </div>

    } @else {

      <div class="sin-proximos-estrenos">

        <p>
          No hay próximos estrenos disponibles.
        </p>

      </div>

    }

  </section>

</main>
