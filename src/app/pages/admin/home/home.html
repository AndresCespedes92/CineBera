<div class="admin-dashboard">
  <header class="dashboard-header"><div><h1>Administración CineBera</h1><p>Elegí una sección para administrar el cine.</p></div></header>
  <section class="admin-section">
    <h2>Gestión del sistema</h2>
    <div class="admin-actions">
      @for (enlace of enlaces; track enlace.ruta) {
        <a class="admin-action" [routerLink]="enlace.ruta"><h3>{{ enlace.titulo }}</h3><p>{{ enlace.descripcion }}</p></a>
      }
    </div>
    <p>Los datos de ventas actualizados están disponibles en Reportes y Gráficos.</p>
  </section>
</div>
