<main class="login-page">
    <section class="login-container">
        <h1>CineBera</h1>        
        <h2>Ingreso al sistema</h2>
        <p>
            Acceso para administradores y empleados
        </p>
        <form>
            <div class="form-field">
                <label for="email">
                    Email
                </label>
                <input
                id="email"
                type="email"
                placeholder="usuario@cinebera.com"
                >
            </div>
            <div class="form-field">
                <label for="password">
                    Contraseña
                </label>
                <input
                id="password"
                type="password"
                placeholder="Ingrese su Contraseña"
                >
            </div>
        <!-- (click)="ingresar()" es el EVENT BINDING cuando ocurra el evento click ejecuta el metodo ingresar()-->
            <button type="button" (click)="ingresar()">
                Ingresar
            </button>
            
        </form>
    </section>
</main>
